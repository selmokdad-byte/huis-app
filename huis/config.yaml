name: Huis
version: "1.1.0"
slug: huis
description: Gezinsplanner met gedeelde agenda's, taken, boodschappen en bediening van je huis.
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
# Huis praat via de Supervisor met Home Assistant: geen eigen token nodig.
homeassistant_api: true
hassio_api: true
# In de zijbalk van Home Assistant, ook in de Home Assistant-app en via Nabu Casa.
ingress: true
ingress_port: 8080
panel_icon: mdi:home-heart
panel_title: Huis
# Optioneel: Huis als losse app (eigen icoon, webmeldingen). Zet op leeg om uit te schakelen.
ports:
  8080/tcp: 8765
ports_description:
  8080/tcp: Huis als losse app (alleen nodig buiten de zijbalk om)
watchdog: tcp://[HOST]:[PORT:8080]
options: {}
schema:
  pin: password?
  vapid_subject: email?
